[project]
name = "reflex-layer"
version = "0.1.0"
description = "Reflex: the learning layer for agent stacks. Calibrated decision models and an evidence gate that move recurring work off the frontier model, trained on your own traffic."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
l1 = ["torch", "transformers>=4.50", "peft", "sentencepiece"]
serve = ["vllm>=0.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reflex", "reflex.adapters", "reflex.importers"]

[tool.setuptools.package-data]
reflex = ["*.sql", "*.json"]
